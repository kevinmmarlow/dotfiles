# Deliberately small. Kitty's defaults already cover tabs, splits, link
# handling, and click-to-open, so only deviations from them live here.

include current-theme.conf

# "Mono", unlike wezterm.lua. Kitty only accepts monospace families, so plain
# "Hack Nerd Font" silently falls back to Menlo.
font_family      Hack Nerd Font Mono
font_size        15.0

background_opacity  0.97
background_blur     20
inactive_text_alpha 0.8
repaint_delay       8

tab_bar_edge       top
tab_bar_min_tabs   1
tab_title_template {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title:^20.32}

# `splits` divides only the focused pane. Kitty's default enables all seven
# layouts, where a new pane reflows the whole tab.
enabled_layouts splits,stack

# Required by the al console alert hook in ~/.zsh/work.zsh. socket-only refuses
# control via escape sequences, so a process on an SSH'd host cannot drive this
# terminal.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Kitty ships zero send_text bindings, and treats Option as a compose key.
# Without the next 8 lines, Cmd+arrow, Cmd+Delete, Option+arrow, and the
# zsh-shift-select sequences (see ~/.zshrc) all do nothing.
macos_option_as_alt yes

map cmd+left        send_text all \x01
map cmd+right       send_text all \x05
map cmd+backspace   send_text all \x15
map shift+cmd+left  send_text all \x1b[1;2H
map shift+cmd+right send_text all \x1b[1;2F
map alt+shift+left  send_text all \x1b[1;4D
map alt+shift+right send_text all \x1b[1;4C
