# Layout only. Kitty sessions restore directories, never running processes.
# Each repo tab mirrors the old wezterm open_angellist_layout: one left pane,
# two stacked right panes.

new_tab venture
layout splits
cd ~/Development/ANGEL_LIST/venture
launch
focus
launch --location=vsplit
launch --location=hsplit

new_tab treasury
layout splits
cd ~/Development/ANGEL_LIST/treasury
launch
focus
launch --location=vsplit
launch --location=hsplit

new_tab ipseity
layout splits
cd ~/Development/ANGEL_LIST/ipseity
launch
focus
launch --location=vsplit
launch --location=hsplit

new_tab nova
layout splits
cd ~/Development/ANGEL_LIST/nova
launch
focus
launch --location=vsplit
launch --location=hsplit

new_tab deps
layout splits
cd ~/Development/ANGEL_LIST/deps
launch

# focus (above) sets each tab's active pane, and also shifts the whole
# session's active tab to whichever tab focused last. Pin it back to venture.
focus_tab 0
